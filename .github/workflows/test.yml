name: Docker checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, generated bundles and lint
        run: docker compose -p ds-bot-ci run --build --rm -T checks
      - name: Build the research image
        run: docker compose -p ds-bot-ci build ds-bot
      - name: Native DSH smoke test
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --entrypoint sh ds-bot-research:local /repo/docker/smoke-native.sh
