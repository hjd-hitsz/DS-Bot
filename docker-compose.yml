# From the repository root, copy .env.example to .env to configure a model.
services:
  ds-bot:
    image: ds-bot-research:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        DSH_VERSION: ${DSH_VERSION:-0.2.2-rc.1}
    ports:
      - "${DS_BOT_BIND:-127.0.0.1}:${DS_BOT_PORT:-13080}:3080"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DSH_TRUSTED_HOST: "${DSH_TRUSTED_HOST:-localhost,127.0.0.1}"
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-1}"
    volumes:
      - data:/data
      - workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 15s

  checks:
    profiles: [checks]
    build:
      context: .
      dockerfile: docker/Dockerfile.checks
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    command: [sh, -ec, "npm test && node scripts/build-client.mjs --check && npm run lint"]

volumes:
  data:
  workspace:
