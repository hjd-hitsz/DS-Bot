# Image-owned overlay: the container is the sandbox boundary, so only full
# access is offered, and the Bots' working folder is /workspace. Upgrades use
# the image build so the plugin and DSH do not drift inside a running container.
- id: permission
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: The container is the boundary. Bots can change every file it can see.
    defaultPreset: danger-full-access
- id: bot
  config:
    workspace: /workspace
    updateCheck: false
